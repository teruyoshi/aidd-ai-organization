version: '3.8'

services:
  # リバースプロキシ・ロードバランサー
  nginx:
    image: nginx:1.25-alpine
    container_name: sample-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sample-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/ssl/certs:ro
      - nginx_logs:/var/log/nginx
    environment:
      - BACKEND_HOST=backend
      - FRONTEND_HOST=frontend
    depends_on:
      - frontend
      - backend
    networks:
      - sample-app-network
    restart: unless-stopped

  # フロントエンド（React + Vite）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development
    container_name: sample-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
      - frontend_dist:/app/dist
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api
      - VITE_WS_URL=ws://localhost:8080/ws
      - VITE_APP_TITLE=AIDD TODO Sample
    networks:
      - sample-app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # バックエンド（Go + chi）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: sample-backend
    ports:
      - "8080:8080"
      - "2345:2345"  # Delve debugger
    volumes:
      - ./backend:/app:cached
      - go_cache:/go/pkg/mod
    environment:
      - GO_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=sample_user
      - DB_PASSWORD=sample_password
      - DB_NAME=sample_todo_db
      - REDIS_URL=redis:6379
      - JWT_SECRET=sample-dev-jwt-secret-key-change-in-production
      - JWT_EXPIRE_HOURS=24
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80
      - LOG_LEVEL=debug
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sample-app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # データベース（MySQL 8.0）
  mysql:
    image: mysql:8.0
    container_name: sample-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    environment:
      - MYSQL_ROOT_PASSWORD=sample_root_password
      - MYSQL_DATABASE=sample_todo_db
      - MYSQL_USER=sample_user
      - MYSQL_PASSWORD=sample_password
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --max-connections=200
    networks:
      - sample-app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sample_user", "-psample_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # キャッシュ・セッション（Redis）
  redis:
    image: redis:7-alpine
    container_name: sample-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/sample-redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=sample_redis_password
    networks:
      - sample-app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sample_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # メトリクス収集（Prometheus）
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sample-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/sample-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/sample-rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - sample-app-network
    restart: unless-stopped

  # メトリクス可視化（Grafana）
  grafana:
    image: grafana/grafana:10.1.0
    container_name: sample-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sample_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:3001/
      - GF_SMTP_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
    networks:
      - sample-app-network
    restart: unless-stopped

  # システムメトリクス（Node Exporter）
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: sample-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - sample-app-network
    restart: unless-stopped

  # ログ収集・転送（Fluentd）
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: sample-fluentd
    volumes:
      - ./logging/fluentd/sample-fluent.conf:/fluentd/etc/fluent.conf:ro
      - fluentd_data:/fluentd/log
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    environment:
      - FLUENTD_CONF=fluent.conf
      - FLUENTD_OPT=-v
    networks:
      - sample-app-network
    restart: unless-stopped

  # 開発用メールサーバー（MailHog）
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sample-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - sample-app-network
    restart: unless-stopped

  # 開発用データベース管理（phpMyAdmin）
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: sample-phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=sample_user
      - PMA_PASSWORD=sample_password
      - MYSQL_ROOT_PASSWORD=sample_root_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sample-app-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  go_cache:
    driver: local
  frontend_dist:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  fluentd_data:
    driver: local

networks:
  sample-app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

# 開発用ヘルスチェック・監視設定
x-logging: &default-logging
  driver: "fluentd"
  options:
    fluentd-address: "localhost:24224"
    tag: "sample.{{.Name}}"