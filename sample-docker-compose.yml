version: '3.8'

services:
  # フロントエンド（React + Vite）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sample-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - sample-network

  # バックエンド（Go + chi）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sample-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app:cached
      - go_cache:/go/pkg/mod
    environment:
      - GO_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=sample_user
      - DB_PASSWORD=sample_password
      - DB_NAME=sample_todo_db
      - JWT_SECRET=sample-dev-jwt-secret-key
      - SERVER_PORT=8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sample-network

  # データベース（MySQL 8.0）
  mysql:
    image: mysql:8.0
    container_name: sample-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=sample_todo_db
      - MYSQL_USER=sample_user
      - MYSQL_PASSWORD=sample_password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - sample-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sample_user", "-psample_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  go_cache:

networks:
  sample-network:
    driver: bridge
